# ACK repo-local PR-loop policy for upgrade-authority (generated by `agent-control onboard pr-loop`,
# reviewed 2026-10-24: main_only model ✓; runtime_dev ✓; codex required+batched (Qodo retired);
# quorum default-off (single-anchor review, matches this repo's history); risky paths = CI/gate tooling.
# CAVEAT (2026-10-24): 4 selftest failures pre-exist ON MAIN under macOS (child-process --out/UTF-8-pipe
# cases; green on Windows) — until fixed (rides the pull-back PR), patch-validation via the selftest
# command must run where it is green, or the build-only command proves the patch.
agentControl:
  requiredVersion: ">=0.5.2 <0.6.0"
  channel: stable
  allowPrerelease: false
  requiredCapabilities:
    - boundedReviewResponseFixCycles
    - requiredReviewerBatching
    - runPrLoopUntilTerminal
    - quietJson
lane:
  id: joefeser-upgrade-authority-pr-review-loop
  version: 0.1.0
  status: active
  description: Repo-local PR-loop policy for upgrade-authority. Codex is the required anchor
    (Qodo is retired for this workflow and must never be tagged); reviews batch before patching;
    bounded freshness cycles instead of endless retags. Lane is introduced by the trial/scope-prework
    distill PR and serves all future PRs from main once merged.
prLoopPacket:
  repo: joefeser/upgrade-authority
  costProfile: small_team
  policyProfile: default
  reviewFreshnessPolicy:
    maxFreshReviewFixCycles: 1
    maxReviewResponseFixCycles: 8
    riskyFileGlobs:
      - .github/workflows/**
      - tools/**
  reviewQuorum:
    enabled: false
    groups:
      trustedCodeReview:
        bots:
          - codex
        minimumReturned: 1
        preferAllReturned: false
        waitForAllTimeoutSeconds: 900
        noneReturnedStopReason: REQUIRED_REVIEW_QUORUM_NOT_MET
  pushPolicy:
    mode: batch_until_review_settles
    localFixesPresent: false
    validationEvidence: []
    findingUrls: []
    waitTimeoutSeconds: 900
  bots:
    codex:
      requirement: required
      waitUntilReturnedBeforeProcessing: true
      waitTimeoutSeconds: 900
      requestAllowed: policy
      requestRetryCeiling: 2
    qodo:
      requirement: disabled  # retired for this workflow (2026-10-20) — never tagged; the doctor's
      # compatibility defaults would otherwise inject a required-qodo batching failure
      waitUntilReturnedBeforeProcessing: false
      waitTimeoutSeconds: 900
      requestAllowed: explicit_only
      requestRetryCeiling: 0
      retryCooldownSeconds: 0
