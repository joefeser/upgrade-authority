name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build src/UpgradeAuthority -c Release --nologo
      - run: dotnet run --project src/UpgradeAuthority -c Release -- selftest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/validate-fixtures.mjs
      - name: Public cleanliness gate
        run: ./tools/check-public-clean.sh
