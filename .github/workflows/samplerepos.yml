name: samplerepos

# SPEC-022's receipted follow-up: a SCHEDULED integration gate for the samplerepos harness.
# The offline deterministic selftest never runs the harness (that isolation is the design); this
# job is the separate tier that catches harness regressions on a schedule instead. The tracemap
# dependency is PINNED — the public repo's green badge must never depend on a sibling repo's HEAD.
# Bumping the pin is a deliberate PR (reviewable diff: what changed upstream, what re-generated).

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {} # manual runs anytime

permissions:
  contents: read # least privilege (house rule)

env:
  TRACEMAP_PIN: cff969dca65c1b48d5cab2b543866b96ef794477 # pinned tracemap commit (deliberate bumps only)

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned to an immutable SHA)
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 (pinned to an immutable SHA)
        with:
          dotnet-version: '10.0.x'
      - name: Clone tracemap at the pinned commit
        run: |
          git clone --quiet https://github.com/joefeser/tracemap.git /tmp/tracemap
          git -C /tmp/tracemap checkout --quiet "$TRACEMAP_PIN"
      - name: Build tracemap
        run: dotnet build /tmp/tracemap/src/dotnet/TraceMap.Cli -c Release --nologo
      - name: Build ua
        run: dotnet build src/UpgradeAuthority -c Release --nologo
      - name: Selftest (the offline tier — must stay green beside the integration tier)
        run: dotnet run --project src/UpgradeAuthority -c Release -- selftest
      - name: Run the full harness (pack, restore, scan, plan, campaign)
        shell: pwsh
        run: ./samplerepos/build.ps1 -Stage all -TracemapCli /tmp/tracemap/src/dotnet/TraceMap.Cli/bin/Release/net10.0/tracemap.dll
      - name: Harness receipts
        if: always()
        run: |
          echo "## samplerepos campaign receipts" >> "$GITHUB_STEP_SUMMARY"
          echo '(terminal status must read complete — a failed/partial campaign marks itself; artifact-memory receipts themselves are vault-resident)' >> "$GITHUB_STEP_SUMMARY"
          cat samplerepos/out/campaign/campaign.v1.json >> "$GITHUB_STEP_SUMMARY" || echo '(no receipts — earlier stage failed)'
          if grep -q '"status":  *"failed"' samplerepos/out/campaign/campaign.v1.json 2>/dev/null; then
            echo "CAMPAIGN RECEIPT MARKED FAILED — see the failure field"; exit 1
          fi
